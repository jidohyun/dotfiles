# Host for Moonlight over Tailscale. Asahi has no hardware encoder, so x264 on the CPU.
sunshine_name = m1-omarchy
capture = kms
encoder = software
sw_preset = superfast
sw_tune = zerolatency
# Web UI (https://localhost:47990) only from this machine; pair PINs here.
origin_web_ui_allowed = pc
# Port base moved off the defaults so the Mac can relay to us without clashing with its own Sunshine.
port = 48989
min_threads = 8
